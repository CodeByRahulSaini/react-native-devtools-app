<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>React Native DevTools</title>
  <link rel="stylesheet" href="target-picker.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="4"/>
          <ellipse cx="50" cy="50" rx="45" ry="18" stroke="currentColor" stroke-width="4"/>
          <ellipse cx="50" cy="50" rx="45" ry="18" stroke="currentColor" stroke-width="4" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="45" ry="18" stroke="currentColor" stroke-width="4" transform="rotate(120 50 50)"/>
          <circle cx="50" cy="50" r="8" fill="currentColor"/>
        </svg>
        <h1 class="logo-text">React Native DevTools</h1>
      </div>
      <p class="subtitle">Select a debug target to connect</p>
    </header>

    <section class="port-config">
      <label class="port-label" for="ports-input">Scan ports</label>
      <div class="port-input-group">
        <input 
          type="text" 
          id="ports-input" 
          class="port-input"
          value="8081, 8082, 8083" 
          placeholder="e.g., 8081, 8082"
        />
        <button id="refresh-btn" class="btn btn-icon" title="Refresh targets">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
      </div>
    </section>

    <main class="targets-container" id="targets-container">
      <div class="loading">
        <div class="spinner"></div>
        <p>Scanning for debug targets...</p>
      </div>
    </main>

    <footer class="footer">
      <button id="open-all-btn" class="btn btn-primary" disabled>
        Open All DevTools
      </button>
    </footer>
  </div>

  <script src="target-picker.js"></script>
</body>
</html>
